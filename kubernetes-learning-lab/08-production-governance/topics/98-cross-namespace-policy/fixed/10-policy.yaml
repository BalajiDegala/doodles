apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: q98-ingress
  namespace: k8s-learning-governance
spec:
  podSelector:
    matchLabels:
      app: q98-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: k8s-learning-cross-source
          podSelector:
            matchLabels:
              role: reader
      ports:
        - protocol: TCP
          port: 8080
