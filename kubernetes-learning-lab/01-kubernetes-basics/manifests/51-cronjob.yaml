apiVersion: batch/v1
kind: CronJob
metadata:
  name: catalog-report
  namespace: k8s-learning-basics
  labels:
    app.kubernetes.io/name: catalog-report
    app.kubernetes.io/part-of: core-components-project
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: catalog-report
            app.kubernetes.io/part-of: core-components-project
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reporter
              image: busybox:1.36
              imagePullPolicy: IfNotPresent
              command: ["/bin/sh", "-c"]
              args:
                - echo "$(date -u) - catalog contains $(wc -l < /catalog/books.txt) books"
              resources:
                requests:
                  cpu: 5m
                  memory: 8Mi
                limits:
                  cpu: 20m
                  memory: 16Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: catalog
                  mountPath: /catalog
                  readOnly: true
          volumes:
            - name: catalog
              configMap:
                name: hello-page
                items:
                  - key: books.txt
                    path: books.txt
