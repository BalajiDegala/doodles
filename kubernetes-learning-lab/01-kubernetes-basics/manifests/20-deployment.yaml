apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: k8s-learning-basics
  labels:
    app: hello-web
    app.kubernetes.io/name: hello-web
    app.kubernetes.io/part-of: core-components-project
  annotations:
    learning.ops2book/purpose: Demonstrate Deployments, ReplicaSets, Pods, configuration, and metadata
    kubernetes.io/change-cause: Initial Tiny Bookshop release 1.0
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 120
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
        app.kubernetes.io/name: hello-web
        app.kubernetes.io/part-of: core-components-project
        app.kubernetes.io/version: "1.0"
      annotations:
        learning.ops2book/managed-by: learner
        kubernetes.io/change-cause: Initial Tiny Bookshop release 1.0
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-page
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sed -e "s/{{RELEASE}}/${APP_RELEASE}/g" -e "s/{{STORE_NAME}}/${STORE_NAME}/g" /template/index.html > /site/index.html
              cp /template/healthz /site/healthz
              cp /template/ready.html /site/ready.html
              echo "Prepared ${STORE_NAME} release ${APP_RELEASE}"
          env:
            - name: APP_RELEASE
              value: "1.0"
            - name: STORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: hello-page
                  key: STORE_NAME
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: page-template
              mountPath: /template
              readOnly: true
            - name: prepared-page
              mountPath: /site
      containers:
        - name: web
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args: ["httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_RELEASE
              value: "1.0"
            - name: APP_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: hello-page
                  key: APP_ENVIRONMENT
            - name: STORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: hello-page
                  key: STORE_NAME
            - name: DEMO_USER
              valueFrom:
                secretKeyRef:
                  name: hello-settings
                  key: demo-user
          readinessProbe:
            httpGet:
              path: /ready.html
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: prepared-page
              mountPath: /www
            - name: page-template
              mountPath: /template
              readOnly: true
            - name: credentials
              mountPath: /var/run/bookshop-secrets
              readOnly: true
      volumes:
        - name: page-template
          configMap:
            name: hello-page
        - name: prepared-page
          emptyDir: {}
        - name: credentials
          secret:
            secretName: hello-settings
            defaultMode: 0440
