apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: k8s-learning-basics
  labels:
    app.kubernetes.io/name: hello-web
    app.kubernetes.io/part-of: core-components-project
  annotations:
    learning.ops2book/purpose: Stable network destination for the application Pods
spec:
  type: ClusterIP
  selector:
    app: hello-web
  ports:
    - name: http
      port: 80
      targetPort: http
