apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-observer
  namespace: k8s-learning-basics
  labels:
    app: node-observer
    app.kubernetes.io/part-of: core-components-project
spec:
  selector:
    matchLabels:
      app: node-observer
  template:
    metadata:
      labels:
        app: node-observer
        app.kubernetes.io/part-of: core-components-project
      annotations:
        learning.ops2book/purpose: Demonstrate one Pod on each eligible node
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: observer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - while true; do echo "node-observer is running on ${NODE_NAME}"; sleep 30; done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 20m
              memory: 16Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
