apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: catalog-identity-boundary
  namespace: k8s-learning-reliability
spec:
  podSelector:
    matchLabels:
      app: reliable-catalog
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              access: approved
      ports:
        - protocol: TCP
          port: 8080
