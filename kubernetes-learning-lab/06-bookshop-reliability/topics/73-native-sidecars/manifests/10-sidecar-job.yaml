apiVersion: batch/v1
kind: Job
metadata:
  name: native-report
  namespace: k8s-learning-reliability
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        exercise: native-sidecar
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: report
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - set -eu; test -f /signals/ready; echo "Bookshop report finished"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: signals
              mountPath: /signals
              readOnly: true
      restartPolicy: Never
      volumes:
        - name: signals
          emptyDir: {}
      initContainers:
        - name: helper
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              touch /signals/ready
              while true; do echo "Helper heartbeat"; sleep 2; done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          restartPolicy: Always
          volumeMounts:
            - name: signals
              mountPath: /signals
          startupProbe:
            exec:
              command:
                - test
                - -f
                - /signals/ready
            periodSeconds: 1
            failureThreshold: 30
