apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bookshop-route
  namespace: k8s-learning-reliability
spec:
  parentRefs:
    - name: bookshop-gateway
      namespace: k8s-learning-reliability
  hostnames:
    - bookshop.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: reliable-catalog
          port: 80
