apiVersion: v1
kind: Pod
metadata:
  name: budget-too-large
  namespace: k8s-learning-budgets
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/os: linux
  terminationGracePeriodSeconds: 15
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: worker
      image: busybox:1.36
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -c
      args:
        - exec sleep 3600
      resources:
        requests:
          cpu: 250m
          memory: 32Mi
        limits:
          cpu: 300m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
