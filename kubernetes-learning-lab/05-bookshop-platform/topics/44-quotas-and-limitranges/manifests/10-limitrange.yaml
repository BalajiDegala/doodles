apiVersion: v1
kind: LimitRange
metadata:
  name: counter-defaults
  namespace: k8s-learning-budgets
spec:
  limits:
    - type: Container
      min:
        cpu: 5m
        memory: 8Mi
      max:
        cpu: 200m
        memory: 128Mi
      default:
        cpu: 100m
        memory: 64Mi
      defaultRequest:
        cpu: 25m
        memory: 32Mi
