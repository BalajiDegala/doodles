apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-log-demo
  namespace: k8s-learning-platform
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        exercise: logs-42
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - |
              echo '{"level":"info","event":"catalog_started","request_id":"lesson-42"}'
              echo '{"level":"warn","event":"supplier_delayed","request_id":"lesson-42"}' >&2
              echo '{"level":"info","event":"catalog_complete","request_id":"lesson-42"}'
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      restartPolicy: Never
