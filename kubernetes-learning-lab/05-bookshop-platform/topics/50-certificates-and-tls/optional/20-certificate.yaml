apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: catalog-lab
  namespace: k8s-learning-platform
spec:
  secretName: catalog-lab-tls
  subject:
    organizations:
      - Bookshop learning lab
  dnsNames:
    - platform-catalog.k8s-learning-platform.svc
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    name: bookshop-selfsigned
    kind: Issuer
    group: cert-manager.io
