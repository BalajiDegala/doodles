apiVersion: v1
kind: Pod
metadata:
  name: closing-worker
  namespace: k8s-learning-operations
  labels: {}
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/os: linux
  terminationGracePeriodSeconds: 20
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: worker
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - |
          set -eu
          trap 'echo "TERM received; closing complete"; exit 0' TERM INT
          echo "Main process started"
          seen_start=false
          seen_stop=false
          while true; do
            if [ -f /state/started ] && [ "$seen_start" = false ]; then
              echo "postStart marker observed"
              seen_start=true
            fi
            if [ -f /state/stopping ] && [ "$seen_stop" = false ]; then
              echo "preStop marker observed"
              seen_stop=true
            fi
            sleep 1
          done
      resources:
        requests:
          cpu: 5m
          memory: 8Mi
        limits:
          cpu: 50m
          memory: 32Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      lifecycle:
        postStart:
          exec:
            command:
              - /bin/sh
              - -c
              - echo started > /state/started
        preStop:
          exec:
            command:
              - /bin/sh
              - -c
              - echo stopping > /state/stopping; sleep 3
      volumeMounts:
        - name: state
          mountPath: /state
  volumes:
    - name: state
      emptyDir: {}
