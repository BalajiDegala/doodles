apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-page-test
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/os: linux
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: {{ .Values.image | quote }}
      command: ["/bin/sh", "-c"]
      args:
        - 'set -eu; actual=$(wget -T 5 -qO- http://{{ .Release.Name }}-web); test "$actual" = "$EXPECTED_PAGE"; echo "Page matches release values"'
      env:
        - name: EXPECTED_PAGE
          value: {{ .Values.page | quote }}
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
