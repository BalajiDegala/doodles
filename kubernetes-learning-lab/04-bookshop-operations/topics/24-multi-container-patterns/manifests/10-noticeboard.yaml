apiVersion: v1
kind: Pod
metadata:
  name: noticeboard
  namespace: k8s-learning-operations
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/os: linux
  terminationGracePeriodSeconds: 15
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          while true; do
            echo "<h1>Bookshop noticeboard</h1><p>$(date -u)</p>" > /www/index.next
            mv /www/index.next /www/index.html
            echo "Noticeboard refreshed"
            sleep 5
          done
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: notice
          mountPath: /www
    - name: web
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args: ["exec httpd -f -p 8080 -h /www"]
      ports:
        - name: http
          containerPort: 8080
      readinessProbe:
        httpGet:
          path: /
          port: http
        periodSeconds: 5
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: notice
          mountPath: /www
          readOnly: true
  volumes:
    - name: notice
      emptyDir: {}
