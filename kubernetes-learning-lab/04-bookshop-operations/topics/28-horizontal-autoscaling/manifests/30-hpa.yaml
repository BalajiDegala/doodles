apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: scale-demo
  namespace: k8s-learning-operations
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: scale-demo
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
