apiVersion: apps/v1
kind: Deployment
metadata:
  name: scale-demo
  namespace: k8s-learning-operations
spec:
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: scale-demo
  template:
    metadata:
      labels:
        app: scale-demo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
          args:
            - |
              set -eu
              if [ "$(cat /load/enabled)" = "true" ]; then
                echo "Starting at most 120 seconds of CPU work"
                timeout 120 sh -c 'while :; do :; done' || true
              fi
              echo "Idle"
              exec sleep 86400
          resources:
            requests:
              cpu: 100m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: load
              mountPath: /load
              readOnly: true
      volumes:
        - name: load
          configMap:
            name: scale-load
