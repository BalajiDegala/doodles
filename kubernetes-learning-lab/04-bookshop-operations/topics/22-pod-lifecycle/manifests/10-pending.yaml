apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-pending
  namespace: k8s-learning-operations
  labels:
    exercise: lifecycle
spec:
  restartPolicy: Never
  schedulingGates:
    - name: learning.ops2book/approval
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/os: linux
  terminationGracePeriodSeconds: 15
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: worker
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - "echo Approved"
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
