apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: q95-worker
  namespace: k8s-learning-incidents
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: q95-worker
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
