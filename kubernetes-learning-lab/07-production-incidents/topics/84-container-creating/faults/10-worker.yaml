apiVersion: v1
kind: Pod
metadata:
  name: q84-worker
  namespace: k8s-learning-incidents
  labels:
    exercise: q84
spec:
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/os: linux
  terminationGracePeriodSeconds: 15
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: worker
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
      args:
        - sleep 3600
      ports:
        - name: http
          containerPort: 8080
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - name: settings
          mountPath: /settings
          readOnly: true
  restartPolicy: Never
  volumes:
    - name: settings
      configMap:
        name: q84-settings
        optional: false
