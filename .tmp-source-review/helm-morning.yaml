---
# Source: bookshop-desk/templates/page.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: desk-page
  namespace: k8s-learning-operations
data:
  index.html: "<h1>Bookshop Helm morning desk</h1>"

---
# Source: bookshop-desk/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: desk-web
  namespace: k8s-learning-operations
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: bookshop-desk
    app.kubernetes.io/instance: desk
  ports:
    - name: http
      port: 80
      targetPort: http

---
# Source: bookshop-desk/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: desk-web
  namespace: k8s-learning-operations
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: bookshop-desk
      app.kubernetes.io/instance: desk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bookshop-desk
        app.kubernetes.io/instance: desk
      annotations:
        checksum/page: "692e63c105c4e123d14315f5e6408725b58159cef58295e0c46a32216adece3c"
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "busybox:1.36"
          command: ["/bin/sh", "-c"]
          args: ["exec httpd -f -p 8080 -h /www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: page
              mountPath: /www
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: desk-page
---
# Source: bookshop-desk/templates/test-page.yaml
apiVersion: v1
kind: Pod
metadata:
  name: desk-page-test
  namespace: k8s-learning-operations
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  nodeSelector:
    kubernetes.io/os: linux
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: check
      image: "busybox:1.36"
      command: ["/bin/sh", "-c"]
      args:
        - 'set -eu; actual=$(wget -T 5 -qO- http://desk-web); test "$actual" = "$EXPECTED_PAGE"; echo "Page matches release values"'
      env:
        - name: EXPECTED_PAGE
          value: "<h1>Bookshop Helm morning desk</h1>"
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]

