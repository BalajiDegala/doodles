apiVersion: v1
data:
  index.html: |
    <h1>Bookshop Kustomize practice</h1>
kind: ConfigMap
metadata:
  name: custom-page
  namespace: k8s-learning-operations
---
apiVersion: v1
kind: Service
metadata:
  name: bookshop-custom
  namespace: k8s-learning-operations
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: bookshop-custom
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookshop-custom
  namespace: k8s-learning-operations
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: bookshop-custom
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: bookshop-custom
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - exec httpd -f -p 8080 -h /www
        command:
        - /bin/sh
        - -c
        image: busybox:1.36
        name: web
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /www
          name: page
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      volumes:
      - configMap:
          name: custom-page
        name: page
