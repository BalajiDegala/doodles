apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: kubernetes-learning-lab
  name: k8s-learning-recovery
---
apiVersion: v1
data:
  index.html: |
    <h1>Tiny Bookshop reliability desk</h1>
  metrics: |
    # HELP bookshop_catalog_titles Number of titles in the teaching catalog.
    # TYPE bookshop_catalog_titles gauge
    bookshop_catalog_titles 60
kind: ConfigMap
metadata:
  name: reliable-catalog-page
  namespace: k8s-learning-recovery
---
apiVersion: v1
kind: Service
metadata:
  name: reliable-catalog
  namespace: k8s-learning-recovery
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app: reliable-catalog
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliable-catalog
  namespace: k8s-learning-recovery
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: reliable-catalog
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: reliable-catalog
        purpose: learning
        team: bookshop
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - exec httpd -f -p 8080 -h /www
        command:
        - /bin/sh
        - -c
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        name: web
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 5
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 25m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /www
          name: page
          readOnly: true
      nodeSelector:
        kubernetes.io/os: linux
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 15
      volumes:
      - configMap:
          name: reliable-catalog-page
        name: page
